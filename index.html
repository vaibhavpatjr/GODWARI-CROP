<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:linear-gradient(135deg,#050816,#0d1b2a,#1b263b);
      position:relative;
      color:white;
    }

    .bg-blur{
      position:absolute;
      width:500px;
      height:500px;
      background:rgba(0,255,255,0.15);
      filter:blur(120px);
      border-radius:50%;
      top:-120px;
      left:-120px;
      animation:float 8s infinite alternate ease-in-out;
    }

    .bg-blur2{
      position:absolute;
      width:450px;
      height:450px;
      background:rgba(255,0,128,0.18);
      filter:blur(120px);
      border-radius:50%;
      bottom:-120px;
      right:-120px;
      animation:float2 10s infinite alternate ease-in-out;
    }

    @keyframes float{
      from{transform:translateY(0px) translateX(0px);}
      to{transform:translateY(40px) translateX(30px);}
    }

    @keyframes float2{
      from{transform:translateY(0px) translateX(0px);}
      to{transform:translateY(-40px) translateX(-30px);}
    }

    .container{
      position:relative;
      z-index:2;
      width:90%;
      max-width:700px;
      padding:50px 40px;
      border-radius:30px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.15);
      box-shadow:0 20px 50px rgba(0,0,0,0.5);
      text-align:center;
    }

    .tag{
      display:inline-block;
      padding:10px 22px;
      border-radius:999px;
      background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.2);
      font-size:14px;
      margin-bottom:25px;
      letter-spacing:1px;
    }

    h1{
      font-size:clamp(2.5rem,6vw,5rem);
      line-height:1.1;
      margin-bottom:20px;
      font-weight:700;
    }

    h1 span{
      background:linear-gradient(90deg,#00e5ff,#ff4fd8);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    p{
      color:#d9d9d9;
      font-size:1rem;
      line-height:1.8;
      margin-bottom:35px;
    }

    .btn-group{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    .btn{
      text-decoration:none;
      padding:14px 32px;
      border-radius:14px;
      font-weight:600;
      transition:0.4s ease;
    }

    .primary{
      background:linear-gradient(90deg,#00e5ff,#0084ff);
      color:white;
      box-shadow:0 10px 25px rgba(0,229,255,0.35);
    }

    .primary:hover{
      transform:translateY(-4px) scale(1.03);
    }

    .secondary{
      border:1px solid rgba(255,255,255,0.25);
      background:rgba(255,255,255,0.05);
      color:white;
    }

    .secondary:hover{
      background:rgba(255,255,255,0.12);
      transform:translateY(-4px);
    }

    .loader{
      margin:35px auto 0;
      width:70px;
      height:70px;
      border:5px solid rgba(255,255,255,0.15);
      border-top:5px solid #00e5ff;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      100%{transform:rotate(360deg);}
    }

    @media(max-width:600px){
      .container{
        padding:40px 25px;
      }

      p{
        font-size:0.95rem;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>
<body>

  <div class="bg-blur"></div>
  <div class="bg-blur2"></div>

  <div class="container">
    <div class="tag">🚀 WEBSITE UNDER DEVELOPMENT</div>

    <h1>Something <span>Amazing</span><br>is Coming Soon</h1>

    <p>
      We’re building a premium digital experience for you. Stay tuned — our website is currently under construction and will launch very soon with something powerful and beautiful.
    </p>

    <div class="btn-group">
      <a href="#" class="btn primary">Notify Me</a>
      <a href="#" class="btn secondary">Contact Us</a>
    </div>

    <div class="loader"></div>
  </div>

</body>
</html>
